[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DA2DP_I2S_AUDIOTOOLS=0
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.10
